<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Szabolcs Szabo — software that earns its place">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1c1615"/>
      <stop offset="55%"  stop-color="#171212"/>
      <stop offset="100%" stop-color="#1a1413"/>
    </linearGradient>

    <linearGradient id="hink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffb454"/>
      <stop offset="45%"  stop-color="#ffd9a0"/>
      <stop offset="100%" stop-color="#ff7a5c"/>
      <animate attributeName="x1" values="-0.6;0.2;-0.6" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.6;0.4"   dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="hrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffb454" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ffb454" stop-opacity=".85"/>
      <stop offset="72%"  stop-color="#ff7a5c" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#ff7a5c" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="hhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffb454" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hhalo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff7a5c" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#ff7a5c" stop-opacity="0"/>
    </radialGradient>

    <filter id="hsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="hgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffd9a0" stroke-opacity=".05" stroke-width="1"/>
    </pattern>

    <clipPath id="hframe"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#hframe)">
    <rect width="1000" height="300" fill="url(#hbg)"/>

    <!-- drifting grid -->
    <rect x="-44" y="-44" width="1088" height="388" fill="url(#hgrid)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 44 44; 0 0" dur="18s" repeatCount="indefinite"/>
    </rect>

    <!-- ambient light -->
    <circle cx="170" cy="60" r="240" fill="url(#hhalo)">
      <animate attributeName="cy" values="60;110;60" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="250" r="230" fill="url(#hhalo2)">
      <animate attributeName="cx" values="850;780;850" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- left accent rail -->
    <rect x="63" y="74" width="2" height="0" fill="#ffb454" opacity=".55">
      <animate attributeName="height" from="0" to="152" begin="0.2s" dur="1s" fill="freeze"/>
    </rect>

    <g font-family="'Cascadia Code',Consolas,'SF Mono',monospace">
      <!-- eyebrow -->
      <text x="88" y="82" font-size="13" fill="#a2938a" letter-spacing="4" opacity="0">
        00&#160;&#183;&#160;INDEX
        <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur=".8s" fill="freeze"/>
      </text>

      <!-- name -->
      <g transform="translate(88,150)" font-family="'Segoe UI Semibold','Helvetica Neue',Arial,sans-serif">
        <text font-size="58" font-weight="700" letter-spacing="1"
              fill="none" stroke="url(#hink)" stroke-width="1"
              stroke-dasharray="1900" stroke-dashoffset="1900">
          Szabolcs Szab&#243;
          <animate attributeName="stroke-dashoffset" from="1900" to="0" begin="0.6s" dur="2s" fill="freeze"/>
        </text>
        <text font-size="58" font-weight="700" letter-spacing="1" fill="url(#hink)" opacity="0">
          Szabolcs Szab&#243;
          <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="1.1s" fill="freeze"/>
        </text>
      </g>

      <!-- rule -->
      <rect x="88" y="176" width="0" height="2" fill="url(#hrule)">
        <animate attributeName="width" from="0" to="560" begin="2.2s" dur="1s" fill="freeze"/>
      </rect>

      <!-- tagline -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur=".9s" fill="freeze"/>
        <text x="88" y="210" font-size="15" fill="#f2ece6">
          I build web applications that are quick, deliberate and pleasant to use
        </text>
        <text x="88" y="234" font-size="15" fill="#a2938a">
          &#8212; production sites for real businesses, and multiplayer game-server tooling.
        </text>
      </g>

      <!-- status pill -->
      <g transform="translate(88,268)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3s" dur=".9s" fill="freeze"/>
        <rect x="0" y="-15" width="212" height="30" rx="15"
              fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".11"/>
        <circle cx="20" cy="0" r="4" fill="#a9c46c">
          <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="0" r="4" fill="none" stroke="#a9c46c" stroke-opacity=".6">
          <animate attributeName="r" values="4;12" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values=".6;0" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="36" y="4" font-size="12" fill="#e0d6cd" letter-spacing="1.4">open to work</text>
      </g>

      <!-- right-side orbit motif -->
      <g transform="translate(810,150)" filter="url(#hsoft)">
        <ellipse rx="120" ry="120" fill="none" stroke="#ffb454" stroke-opacity=".12"/>
        <ellipse rx="84"  ry="84"  fill="none" stroke="#ff7a5c" stroke-opacity=".12"/>
        <ellipse rx="48"  ry="48"  fill="none" stroke="#ffd9a0" stroke-opacity=".12"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
          <circle cx="120" cy="0" r="3.5" fill="#ffb454"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
          <circle cx="84" cy="0" r="2.8" fill="#ff7a5c"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="10s" repeatCount="indefinite"/>
          <circle cx="48" cy="0" r="2.4" fill="#a9c46c"/>
        </g>
        <circle r="5" fill="#ffd9a0" opacity=".9">
          <animate attributeName="r" values="5;7;5" dur="3.4s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- slow sheen -->
    <rect x="-300" y="0" width="300" height="300" opacity=".04" fill="#ffffff">
      <animate attributeName="x" from="-300" to="1000" dur="9s" begin="4s" repeatCount="indefinite"/>
    </rect>

    <rect width="1000" height="300" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
  </g>
</svg>
