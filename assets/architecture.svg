<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="System topology — packets flowing between client, server, database and stream layers">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141618"/><stop offset="100%" stop-color="#0e0f11"/>
    </linearGradient>

    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb454" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ff7a5c" stop-opacity=".10"/>
    </linearGradient>

    <filter id="pglow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="af"><rect width="900" height="320" rx="12"/></clipPath>

    <!-- edge geometry, shared by the drawn line and the packets riding it -->
    <path id="e1" d="M175,120 C260,120 280,170 365,170" fill="none"/>
    <path id="e2" d="M175,250 C260,250 280,200 365,200" fill="none"/>
    <path id="e3" d="M535,170 C620,170 640,120 725,120" fill="none"/>
    <path id="e4" d="M535,200 C620,200 640,250 725,250" fill="none"/>
  </defs>

  <g clip-path="url(#af)" font-family="'Cascadia Code',Consolas,'SF Mono',Menlo,monospace">
    <rect width="900" height="320" fill="url(#abg)"/>

    <text x="24" y="34" fill="#eef1f4" font-size="13" letter-spacing="2.4">SYSTEM TOPOLOGY</text>
    <text x="876" y="34" text-anchor="end" fill="#4a5057" font-size="11" letter-spacing="1.4">authoritative server</text>
    <line x1="24" y1="46" x2="876" y2="46" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- ── edges ─────────────────────────────────────────────────────── -->
    <g fill="none" stroke-width="1.4" stroke-linecap="round">
      <g stroke="#ffb454" stroke-opacity=".38" stroke-dasharray="5 7">
        <use href="#e1"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/></use>
        <use href="#e3"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/></use>
      </g>
      <g stroke="#ff7a5c" stroke-opacity=".34" stroke-dasharray="5 7">
        <use href="#e2"><animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.4s" repeatCount="indefinite"/></use>
        <use href="#e4"><animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.4s" repeatCount="indefinite"/></use>
      </g>
    </g>

    <g font-size="9.5" fill="#4a5057" letter-spacing="1.2">
      <text x="252" y="132">rpc</text>
      <text x="252" y="243">event</text>
      <text x="612" y="132">query</text>
      <text x="608" y="243">stream</text>
    </g>

    <!-- ── packets ───────────────────────────────────────────────────── -->
    <g filter="url(#pglow)">
      <!-- outbound: client -> server -> db -->
      <circle r="3.4" fill="#ffb454">
        <animateMotion dur="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e1"/></animateMotion>
      </circle>
      <circle r="2.4" fill="#ffd9a0">
        <animateMotion dur="2.6s" begin="-1.3s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion>
      </circle>
      <circle r="3.4" fill="#ffb454">
        <animateMotion dur="2.6s" begin="-0.5s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion>
      </circle>

      <!-- inbound: server <- ui, stream -> clients (reverse traversal) -->
      <circle r="3" fill="#ff7a5c">
        <animateMotion dur="3.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e2"/></animateMotion>
      </circle>
      <circle r="2.2" fill="#ffa98f">
        <animateMotion dur="3.1s" begin="-1.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e2"/></animateMotion>
      </circle>
      <circle r="3" fill="#ff7a5c">
        <animateMotion dur="3.1s" begin="-0.9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e4"/></animateMotion>
      </circle>
      <circle r="2.2" fill="#a9c46c">
        <animateMotion dur="3.1s" begin="-2.3s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion>
      </circle>
    </g>

    <!-- ── nodes ─────────────────────────────────────────────────────── -->

    <!-- client -->
    <g transform="translate(45,96)">
      <rect width="130" height="48" rx="9" fill="#ffffff" fill-opacity=".04" stroke="#ffb454" stroke-opacity=".28"/>
      <circle cx="18" cy="24" r="4" fill="#ffb454"/>
      <circle cx="18" cy="24" r="4" fill="none" stroke="#ffb454" stroke-opacity=".7">
        <animate attributeName="r" values="4;13" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".7;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="21" font-size="12" fill="#eef1f4">client</text>
      <text x="34" y="35" font-size="9" fill="#4a5057" letter-spacing="1">untrusted</text>
    </g>

    <!-- nui -->
    <g transform="translate(45,226)">
      <rect width="130" height="48" rx="9" fill="#ffffff" fill-opacity=".04" stroke="#ff7a5c" stroke-opacity=".28"/>
      <circle cx="18" cy="24" r="4" fill="#ff7a5c"/>
      <circle cx="18" cy="24" r="4" fill="none" stroke="#ff7a5c" stroke-opacity=".7">
        <animate attributeName="r" values="4;13" dur="3.1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".7;0" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="21" font-size="12" fill="#eef1f4">ui layer</text>
      <text x="34" y="35" font-size="9" fill="#4a5057" letter-spacing="1">angular</text>
    </g>

    <!-- server core -->
    <g transform="translate(365,151)">
      <rect width="170" height="68" rx="11" fill="url(#core)" stroke="#ffb454" stroke-opacity=".45"/>
      <rect width="170" height="68" rx="11" fill="none" stroke="#ffb454" stroke-opacity=".5">
        <animate attributeName="stroke-opacity" values=".5;.12;.5" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="85" y="28" text-anchor="middle" font-size="14" fill="#ffd9a0" letter-spacing="1.4">server</text>
      <text x="85" y="45" text-anchor="middle" font-size="9" fill="#9099a1" letter-spacing="1.4">source of truth</text>

      <!-- load bars -->
      <g transform="translate(52,54)">
        <rect width="66" height="4" rx="2" fill="#ffffff" fill-opacity=".08"/>
        <rect width="20" height="4" rx="2" fill="#a9c46c">
          <animate attributeName="width" values="14;52;26;44;18" dur="4.8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- database -->
    <g transform="translate(725,96)">
      <rect width="130" height="48" rx="9" fill="#ffffff" fill-opacity=".04" stroke="#ffb454" stroke-opacity=".28"/>
      <g transform="translate(18,24)" stroke="#ffb454" stroke-opacity=".8" fill="none" stroke-width="1.3">
        <ellipse cx="0" cy="-7" rx="7" ry="2.8"/>
        <path d="M-7,-7 v14 a7,2.8 0 0 0 14,0 v-14"/>
        <path d="M-7,0 a7,2.8 0 0 0 14,0"/>
      </g>
      <text x="34" y="21" font-size="12" fill="#eef1f4">mysql</text>
      <text x="34" y="35" font-size="9" fill="#4a5057" letter-spacing="1">persistence</text>
    </g>

    <!-- stream -->
    <g transform="translate(725,226)">
      <rect width="130" height="48" rx="9" fill="#ffffff" fill-opacity=".04" stroke="#a9c46c" stroke-opacity=".26"/>
      <g transform="translate(18,24)">
        <rect x="-6" y="2" width="3" height="6" rx="1" fill="#a9c46c" fill-opacity=".9"/>
        <rect x="-1" y="-2" width="3" height="10" rx="1" fill="#a9c46c" fill-opacity=".9">
          <animate attributeName="height" values="10;4;10" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="y" values="-2;4;-2" dur="1.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="4" y="-6" width="3" height="14" rx="1" fill="#a9c46c" fill-opacity=".9">
          <animate attributeName="height" values="14;6;14" dur="1.6s" begin="-.5s" repeatCount="indefinite"/>
          <animate attributeName="y" values="-6;2;-6" dur="1.6s" begin="-.5s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="34" y="21" font-size="12" fill="#eef1f4">streaming</text>
      <text x="34" y="35" font-size="9" fill="#4a5057" letter-spacing="1">proximity</text>
    </g>

    <!-- footer legend -->
    <g font-size="9.5" letter-spacing="1.2">
      <circle cx="30" cy="298" r="3.2" fill="#ffb454"/>
      <text x="40" y="301" fill="#4a5057">request</text>
      <circle cx="118" cy="298" r="3.2" fill="#ff7a5c"/>
      <text x="128" y="301" fill="#4a5057">response</text>
      <circle cx="214" cy="298" r="3.2" fill="#a9c46c"/>
      <text x="224" y="301" fill="#4a5057">broadcast</text>
    </g>

    <rect width="900" height="320" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
