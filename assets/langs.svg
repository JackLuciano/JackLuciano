<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="380" height="320" role="img" aria-label="Language breakdown">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
