<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 92" width="1000" height="92" role="img" aria-label="02 stack — the daily tooling">
  <defs>
    <linearGradient id="s02bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141618"/><stop offset="100%" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="s02rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="s02f"><rect width="1000" height="92" rx="12"/></clipPath>
    <clipPath id="s02type"><rect x="0" y="0" height="92" width="0">
      <animate attributeName="width" from="0" to="1000" begin="0.42s" dur="0.9s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#s02f)" font-family="'Cascadia Code',Consolas,'SF Mono',monospace">
    <rect width="1000" height="92" fill="url(#s02bg)"/>

    <!-- numeral block -->
    <rect x="0" y="0" width="3" height="92" fill="#ffd9a0" opacity=".85"/>
    <text x="30" y="59" font-size="34" font-weight="700" fill="#ffd9a0" fill-opacity=".22">02</text>

    <g clip-path="url(#s02type)">
      <text x="98" y="44" font-size="23" font-weight="600" fill="#eef1f4" letter-spacing="1.5"
            font-family="'Segoe UI Semibold','Helvetica Neue',Arial,sans-serif">stack</text>
      <text x="98" y="70" font-size="13" fill="#9099a1" letter-spacing="1.2">the daily tooling</text>
    </g>

    <!-- caret parked at the end of the type reveal -->
    <rect x="98" y="26" width="2" height="22" fill="#ffd9a0">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x" from="98" to="165.5" begin="0.42s" dur="0.9s" fill="freeze"/>
    </rect>

    <!-- travelling underline -->
    <rect x="98" y="76" width="0" height="1.5" fill="url(#s02rule)">
      <animate attributeName="width" from="0" to="840" begin="1.2200000000000002s" dur="1.1s" fill="freeze"/>
    </rect>

    <!-- right-edge tick marks, a quiet ruler -->
    <g stroke="#ffd9a0" stroke-opacity=".35">
      <line x1="976" y1="62" x2="976" y2="70" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0s" repeatCount="indefinite"/></line>
      <line x1="964" y1="62" x2="964" y2="71" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.18s" repeatCount="indefinite"/></line>
      <line x1="952" y1="62" x2="952" y2="72" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.36s" repeatCount="indefinite"/></line>
      <line x1="940" y1="62" x2="940" y2="73" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.54s" repeatCount="indefinite"/></line>
      <line x1="928" y1="62" x2="928" y2="74" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.72s" repeatCount="indefinite"/></line>
      <line x1="916" y1="62" x2="916" y2="75" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.8999999999999999s" repeatCount="indefinite"/></line>
    </g>

    <rect width="1000" height="92" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
