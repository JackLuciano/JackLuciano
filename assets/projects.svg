<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-label="shipped projects">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171314"/><stop offset="100%" stop-color="#0a0809"/>
    </linearGradient>
    <linearGradient id="pedgeA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb454"/><stop offset="100%" stop-color="#ffb454" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="pedgeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a5c"/><stop offset="100%" stop-color="#ff7a5c" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="pedgeF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c46c"/><stop offset="100%" stop-color="#a9c46c" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="pglow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9c46c" stop-opacity=".085"/>
      <stop offset="55%" stop-color="#a9c46c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pscan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9c46c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a9c46c" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a9c46c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pf"><rect width="940" height="438" rx="12"/></clipPath>
    <clipPath id="cardF"><rect x="20" y="66" width="900" height="150" rx="10"/></clipPath>
    <clipPath id="cardA"><rect x="20" y="236" width="440" height="182" rx="10"/></clipPath>
    <clipPath id="cardB"><rect x="480" y="236" width="440" height="182" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#pf)" font-family="'Cascadia Code',Consolas,monospace">
    <rect width="940" height="438" fill="url(#pbg)"/>

    <text x="20" y="34" fill="#f2ece6" font-size="13" letter-spacing="2.4">SHIPPED / IN PRODUCTION</text>
    <text x="920" y="34" text-anchor="end" fill="#4b4240" font-size="11">3 live</text>
    <line x1="20" y1="48" x2="920" y2="48" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- ============ card 01 : thejacks.xyz (featured) ============ -->
    <g>
      <rect x="20" y="66" width="900" height="150" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#a9c46c" stroke-opacity=".22"/>
      <rect x="20" y="66" width="900" height="150" rx="10" fill="url(#pglow)"/>
      <rect x="20" y="66" width="3" height="150" fill="url(#pedgeF)"/>
      <g clip-path="url(#cardF)">
        <rect x="20" y="66" width="180" height="1" fill="url(#pscan)">
          <animate attributeName="x" from="-160" to="920" dur="4.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <text x="42" y="94" fill="#4b4240" font-size="10.5" letter-spacing="1.6">01</text>
      <g transform="translate(70,85)">
        <rect width="66" height="15" rx="4" fill="#a9c46c" fill-opacity=".14"/>
        <text x="33" y="10.8" text-anchor="middle" fill="#a9c46c" font-size="8.5" letter-spacing="1.4">FEATURED</text>
      </g>
      <text x="42" y="120" fill="#a9c46c" font-size="24" letter-spacing=".5">thejacks.xyz</text>

      <g transform="translate(898,112)" text-anchor="end">
        <circle cx="-58" cy="-4" r="3.4" fill="#a9c46c">
          <animate attributeName="r" values="3.4;5.2;3.4" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="-4" y="0" fill="#a9c46c" font-size="10.5" letter-spacing="1.4">LIVE &#183; PERSONAL SITE</text>
      </g>

      <text x="42" y="145" fill="#a2938a" font-size="12">Portfolio &#8212; interactive skill map, 3D scenes, live GitHub feed, project</text>
      <text x="42" y="162" fill="#a2938a" font-size="12">case studies and an experience timeline. Everything I build, in one place.</text>

      <g font-size="10" fill="#7d716c">
        <g transform="translate(42,178)">
          <rect width="60" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="30" y="12.5" text-anchor="middle">Next.js</text>
        </g>
        <g transform="translate(108,178)">
          <rect width="50" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="25" y="12.5" text-anchor="middle">React</text>
        </g>
        <g transform="translate(164,178)">
          <rect width="62" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="31" y="12.5" text-anchor="middle">Three.js</text>
        </g>
        <g transform="translate(232,178)">
          <rect width="82" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="41" y="12.5" text-anchor="middle">TypeScript</text>
        </g>
        <g transform="translate(320,178)">
          <rect width="60" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="30" y="12.5" text-anchor="middle">Tailwind</text>
        </g>
      </g>

      <text x="898" y="192" text-anchor="end" fill="#a9c46c" font-size="11.5">&#8599; https://thejacks.xyz</text>
    </g>

    <!-- ============ card 02 : biro-butor ============ -->
    <g>
      <rect x="20" y="236" width="440" height="182" rx="10" fill="#ffffff" fill-opacity=".022" stroke="#ffffff" stroke-opacity=".07"/>
      <rect x="20" y="236" width="2.5" height="182" fill="url(#pedgeA)"/>
      <g clip-path="url(#cardA)">
        <rect x="20" y="236" width="120" height="1" fill="url(#pscan)">
          <animate attributeName="x" from="-80" to="460" dur="4.2s" begin="0.4s" repeatCount="indefinite"/>
        </rect>
      </g>

      <text x="42" y="264" fill="#4b4240" font-size="10.5" letter-spacing="1.6">02</text>
      <text x="42" y="286" fill="#ffb454" font-size="17">biro-butor</text>

      <g transform="translate(438,280)" text-anchor="end">
        <circle cx="-58" cy="-4" r="3.4" fill="#a9c46c">
          <animate attributeName="r" values="3.4;5.2;3.4" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="-4" y="0" fill="#a9c46c" font-size="10.5" letter-spacing="1.4">LIVE &#183; VERCEL</text>
      </g>

      <text x="42" y="310" fill="#a2938a" font-size="11.5">Office furniture showcase &#8212; filterable product</text>
      <text x="42" y="326" fill="#a2938a" font-size="11.5">gallery, lightbox, bilingual copy, mobile-first.</text>

      <g font-size="10" fill="#7d716c">
        <g transform="translate(42,346)">
          <rect width="46" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="23" y="12.5" text-anchor="middle">Astro</text>
        </g>
        <g transform="translate(94,346)">
          <rect width="82" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="41" y="12.5" text-anchor="middle">TypeScript</text>
        </g>
        <g transform="translate(182,346)">
          <rect width="60" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="30" y="12.5" text-anchor="middle">Tailwind</text>
        </g>
        <g transform="translate(248,346)">
          <rect width="54" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="27" y="12.5" text-anchor="middle">Gallery</text>
        </g>
      </g>

      <line x1="42" y1="380" x2="438" y2="380" stroke="#ffffff" stroke-opacity=".06"/>
      <text x="42" y="402" fill="#4b4240" font-size="10.5">&#8599; biro-butor.vercel.app</text>
      <text x="438" y="402" text-anchor="end" fill="#4b4240" font-size="10.5">client work</text>
    </g>

    <!-- ============ card 03 : duna-palma ============ -->
    <g>
      <rect x="480" y="236" width="440" height="182" rx="10" fill="#ffffff" fill-opacity=".022" stroke="#ffffff" stroke-opacity=".07"/>
      <rect x="480" y="236" width="2.5" height="182" fill="url(#pedgeB)"/>
      <g clip-path="url(#cardB)">
        <rect x="480" y="236" width="120" height="1" fill="url(#pscan)">
          <animate attributeName="x" from="380" to="920" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <text x="502" y="264" fill="#4b4240" font-size="10.5" letter-spacing="1.6">03</text>
      <text x="502" y="286" fill="#ff7a5c" font-size="17">duna-palma</text>

      <g transform="translate(898,280)" text-anchor="end">
        <circle cx="-58" cy="-4" r="3.4" fill="#a9c46c">
          <animate attributeName="r" values="3.4;5.2;3.4" dur="2s" begin="1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;.35;1" dur="2s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <text x="-4" y="0" fill="#a9c46c" font-size="10.5" letter-spacing="1.4">LIVE &#183; VERCEL</text>
      </g>

      <text x="502" y="310" fill="#a2938a" font-size="11.5">Restaurant &amp; rotisserie &#8212; two locations, weekly</text>
      <text x="502" y="326" fill="#a2938a" font-size="11.5">menu, image galleries, online ordering flow.</text>

      <g font-size="10" fill="#7d716c">
        <g transform="translate(502,346)">
          <rect width="46" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="23" y="12.5" text-anchor="middle">Astro</text>
        </g>
        <g transform="translate(554,346)">
          <rect width="82" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="41" y="12.5" text-anchor="middle">TypeScript</text>
        </g>
        <g transform="translate(642,346)">
          <rect width="60" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="30" y="12.5" text-anchor="middle">Tailwind</text>
        </g>
        <g transform="translate(708,346)">
          <rect width="46" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="23" y="12.5" text-anchor="middle">Menu</text>
        </g>
        <g transform="translate(760,346)">
          <rect width="70" height="18" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="35" y="12.5" text-anchor="middle">Ordering</text>
        </g>
      </g>

      <line x1="502" y1="380" x2="898" y2="380" stroke="#ffffff" stroke-opacity=".06"/>
      <text x="502" y="402" fill="#4b4240" font-size="10.5">&#8599; dunapalma.vercel.app</text>
      <text x="898" y="402" text-anchor="end" fill="#4b4240" font-size="10.5">client work</text>
    </g>
  </g>
</svg>
