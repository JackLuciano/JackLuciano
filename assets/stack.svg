<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" width="340" height="320" role="img" aria-label="stack proficiency">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c111c"/><stop offset="100%" stop-color="#070a11"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c66b"/><stop offset="100%" stop-color="#ffe6ad"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ad7ff"/><stop offset="100%" stop-color="#a9e9ff"/>
    </linearGradient>
    <clipPath id="sf"><rect width="340" height="320" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#sf)" font-family="'Cascadia Code',Consolas,monospace">
    <rect width="340" height="320" fill="url(#sbg)"/>
    <text x="20" y="34" fill="#e6edf6" font-size="13" letter-spacing="2.4">STACK LOAD</text>
    <line x1="20" y1="46" x2="320" y2="46" stroke="#ffffff" stroke-opacity=".08"/>

    <g font-size="11.5" fill="#8fa3bf">
      <!-- row template: label / track / fill / pct -->
      <g transform="translate(0,78)">
        <text x="20" y="0">Lua</text>
        <rect x="20" y="10" width="300" height="6" rx="3" fill="#ffffff" fill-opacity=".06"/>
        <rect x="20" y="10" width="0" height="6" rx="3" fill="url(#barA)">
          <animate attributeName="width" from="0" to="285" begin="0.3s" dur="1.3s" fill="freeze"/>
        </rect>
        <text x="320" y="0" text-anchor="end" fill="#f5c66b">95</text>
      </g>
      <g transform="translate(0,124)">
        <text x="20" y="0">TypeScript</text>
        <rect x="20" y="10" width="300" height="6" rx="3" fill="#ffffff" fill-opacity=".06"/>
        <rect x="20" y="10" width="0" height="6" rx="3" fill="url(#barB)">
          <animate attributeName="width" from="0" to="264" begin="0.5s" dur="1.3s" fill="freeze"/>
        </rect>
        <text x="320" y="0" text-anchor="end" fill="#7ad7ff">88</text>
      </g>
      <g transform="translate(0,170)">
        <text x="20" y="0">Angular</text>
        <rect x="20" y="10" width="300" height="6" rx="3" fill="#ffffff" fill-opacity=".06"/>
        <rect x="20" y="10" width="0" height="6" rx="3" fill="url(#barB)">
          <animate attributeName="width" from="0" to="246" begin="0.7s" dur="1.3s" fill="freeze"/>
        </rect>
        <text x="320" y="0" text-anchor="end" fill="#7ad7ff">82</text>
      </g>
      <g transform="translate(0,216)">
        <text x="20" y="0">SQL / MySQL</text>
        <rect x="20" y="10" width="300" height="6" rx="3" fill="#ffffff" fill-opacity=".06"/>
        <rect x="20" y="10" width="0" height="6" rx="3" fill="url(#barA)">
          <animate attributeName="width" from="0" to="231" begin="0.9s" dur="1.3s" fill="freeze"/>
        </rect>
        <text x="320" y="0" text-anchor="end" fill="#f5c66b">77</text>
      </g>
      <g transform="translate(0,262)">
        <text x="20" y="0">Sleep</text>
        <rect x="20" y="10" width="300" height="6" rx="3" fill="#ffffff" fill-opacity=".06"/>
        <rect x="20" y="10" width="0" height="6" rx="3" fill="#ff5f57">
          <animate attributeName="width" from="0" to="36" begin="1.1s" dur="1.3s" fill="freeze"/>
        </rect>
        <text x="320" y="0" text-anchor="end" fill="#ff5f57">12</text>
      </g>
    </g>

    <rect x="-120" y="0" width="120" height="320" fill="#ffffff" opacity=".04">
      <animate attributeName="x" from="-120" to="340" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect width="340" height="320" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
