<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-label="commit to production pipeline">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1615"/><stop offset="100%" stop-color="#171212"/>
    </linearGradient>
    <linearGradient id="ptrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb454" stop-opacity=".5"/>
      <stop offset="50%" stop-color="#ffd9a0" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#a9c46c" stop-opacity=".5"/>
    </linearGradient>
    <filter id="pglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pf"><rect width="1000" height="140" rx="12"/></clipPath>
    <path id="ptrackpath" d="M120 78 H880" fill="none"/>
  </defs>

  <g clip-path="url(#pf)" font-family="'Cascadia Code',Consolas,'SF Mono',monospace">
    <rect width="1000" height="140" fill="url(#pbg)"/>

    <text x="24" y="32" font-size="12" fill="#a2938a" letter-spacing="3">PIPELINE &#183; COMMIT &#8594; PRODUCTION</text>
    <line x1="24" y1="46" x2="976" y2="46" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- track -->
    <line x1="120" y1="78" x2="880" y2="78" stroke="#ffffff" stroke-opacity=".08" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="78" x2="880" y2="78" stroke="url(#ptrack)" stroke-width="1.5" stroke-linecap="round"
          stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>

    <!-- stages -->
    <g>
      <g transform="translate(120,78)">
        <circle r="9" fill="#1c1615" stroke="#ffb454" stroke-width="2"/>
        <circle r="3.5" fill="#ffb454"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
        <text y="34" font-size="12" fill="#f2ece6" text-anchor="middle">commit</text>
        <text y="50" font-size="10" fill="#a2938a" text-anchor="middle">small, honest</text>
      </g>
      <g transform="translate(310,78)">
        <circle r="9" fill="#1c1615" stroke="#ffd9a0" stroke-width="2"/>
        <circle r="3.5" fill="#ffd9a0"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin=".3s" repeatCount="indefinite"/></circle>
        <text y="34" font-size="12" fill="#f2ece6" text-anchor="middle">review</text>
        <text y="50" font-size="10" fill="#a2938a" text-anchor="middle">read it again</text>
      </g>
      <g transform="translate(500,78)">
        <circle r="9" fill="#1c1615" stroke="#ff7a5c" stroke-width="2"/>
        <circle r="3.5" fill="#ff7a5c"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin=".6s" repeatCount="indefinite"/></circle>
        <text y="34" font-size="12" fill="#f2ece6" text-anchor="middle">build</text>
        <text y="50" font-size="10" fill="#a2938a" text-anchor="middle">typed, tested</text>
      </g>
      <g transform="translate(690,78)">
        <circle r="9" fill="#1c1615" stroke="#ffb454" stroke-width="2"/>
        <circle r="3.5" fill="#ffb454"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin=".9s" repeatCount="indefinite"/></circle>
        <text y="34" font-size="12" fill="#f2ece6" text-anchor="middle">ship</text>
        <text y="50" font-size="10" fill="#a2938a" text-anchor="middle">behind a flag</text>
      </g>
      <g transform="translate(880,78)">
        <circle r="11" fill="#1c1615" stroke="#a9c46c" stroke-width="2"/>
        <circle r="4" fill="#a9c46c"/>
        <circle r="11" fill="none" stroke="#a9c46c" stroke-opacity=".7">
          <animate attributeName="r" values="11;24" dur="2.6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values=".7;0" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text y="36" font-size="12" fill="#a9c46c" text-anchor="middle">live</text>
        <text y="52" font-size="10" fill="#a2938a" text-anchor="middle">watch it settle</text>
      </g>
    </g>

    <!-- packets riding the track -->
    <g filter="url(#pglow)">
      <circle r="4" fill="#ffd9a0">
        <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
          <mpath href="#ptrackpath"/>
        </animateMotion>
      </circle>
      <circle r="3" fill="#ff7a5c">
        <animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#ptrackpath"/></animateMotion>
      </circle>
      <circle r="2.5" fill="#a9c46c">
        <animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath href="#ptrackpath"/></animateMotion>
      </circle>
    </g>

    <rect width="1000" height="140" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
