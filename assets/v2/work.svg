<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="selected work: cairn, tessera, claude-bridge-blender, fivem-launcher, thejacks.xyz, client sites">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15151b"/><stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="gA" cx=".85" cy="0" r=".9"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".32"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="1" cy="0" r="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".3"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff4d6d" stop-opacity=".28"/><stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/></radialGradient>
    <radialGradient id="gD" cx="1" cy="0" r="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="gE" cx="1" cy="0" r="1"><stop offset="0" stop-color="#4ade80" stop-opacity=".2"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/><stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <style>
      .t{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
      .m{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace}
      .h{font-weight:650;letter-spacing:-.6px;fill:#f4f4f5}
      .d{fill:#9ca3af}
      .k{fill:#6b7280;letter-spacing:1.6px}
      .tile{animation:in .8s cubic-bezier(.2,.8,.2,1) both}
      .tile:nth-of-type(2){animation-delay:.08s}.tile:nth-of-type(3){animation-delay:.16s}
      .tile:nth-of-type(4){animation-delay:.24s}.tile:nth-of-type(5){animation-delay:.32s}.tile:nth-of-type(6){animation-delay:.4s}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    </style>
  </defs>

  <g class="tile">
    <rect x="0" y="0" width="560" height="330" rx="18" fill="url(#card)"/>
    <rect x="0" y="0" width="560" height="330" rx="18" fill="url(#gA)"/>
    <rect x=".5" y=".5" width="559" height="329" rx="18" fill="none" stroke="url(#stroke)"/>
    <text class="m k" x="30" y="40" font-size="11">FLAGSHIP · OPEN SOURCE</text>
    <text class="t h" x="30" y="92" font-size="40">cairn</text>
    <text class="m" x="142" y="90" font-size="12" fill="#ffb454">v0.5.2</text>
    <text class="t d" x="30" y="124" font-size="15">A fast, friendly desktop git client in Rust + GPUI.</text>
    <g class="m" font-size="12.5" fill="#d4d4d8">
      <text x="30" y="166"><tspan fill="#ffb454">◆</tspan>  interactive rebase · absorb / split</text>
      <text x="30" y="190"><tspan fill="#ff8a6b">◆</tspan>  stacked PRs · multi-repo workspaces</text>
      <text x="30" y="214"><tspan fill="#ff4d6d">◆</tspan>  3-way conflict editor</text>
      <text x="30" y="238"><tspan fill="#c4b5fd">◆</tspan>  AI assist · undo for everything</text>
    </g>
    <g transform="translate(360,108)">
      <g stroke-width="2.5" fill="none" stroke-linecap="round">
        <path d="M20 10V150" stroke="#3f3f46"/>
        <path d="M20 40C20 70 80 60 80 90V120" stroke="#ffb454"/>
        <path d="M80 120C80 140 20 135 20 150" stroke="#ffb454" stroke-dasharray="4 5"/>
        <path d="M20 70C20 90 140 80 140 105V125" stroke="#8b5cf6"/>
      </g>
      <circle cx="20" cy="10" r="6" fill="#0d0d11" stroke="#a1a1aa" stroke-width="2.5"/>
      <circle cx="20" cy="40" r="6" fill="#0d0d11" stroke="#a1a1aa" stroke-width="2.5"/>
      <circle cx="80" cy="90" r="6" fill="#ffb454"/>
      <circle cx="80" cy="120" r="6" fill="#ffb454">
        <animate attributeName="r" values="6;8.5;6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="125" r="6" fill="#8b5cf6"/>
      <circle cx="20" cy="150" r="7" fill="#0d0d11" stroke="#ffb454" stroke-width="2.5"/>
      <text class="m" x="94" y="94" font-size="10" fill="#71717a">feat/stack</text>
      <text class="m" x="154" y="129" font-size="10" fill="#71717a">ai</text>
    </g>
    <g class="m" font-size="11" fill="#a1a1aa">
      <g transform="translate(30,276)"><rect width="56" height="26" rx="13" fill="#fff" fill-opacity=".06"/><text x="28" y="17.5" text-anchor="middle">Rust</text></g>
      <g transform="translate(94,276)"><rect width="56" height="26" rx="13" fill="#fff" fill-opacity=".06"/><text x="28" y="17.5" text-anchor="middle">GPUI</text></g>
      <g transform="translate(158,276)"><rect width="76" height="26" rx="13" fill="#fff" fill-opacity=".06"/><text x="38" y="17.5" text-anchor="middle">libgit2</text></g>
    </g>
    <text class="m" x="530" y="294" text-anchor="end" font-size="11.5" fill="#ffb454">github.com/JackLuciano/cairn ↗</text>
  </g>

  <g class="tile">
    <rect x="580" y="0" width="420" height="155" rx="18" fill="url(#card)"/>
    <rect x="580" y="0" width="420" height="155" rx="18" fill="url(#gB)"/>
    <rect x="580.5" y=".5" width="419" height="154" rx="18" fill="none" stroke="url(#stroke)"/>
    <text class="m k" x="606" y="34" font-size="10.5">DESKTOP · TAURI</text>
    <text class="t h" x="606" y="72" font-size="26">tessera</text>
    <text class="m" x="718" y="70" font-size="11" fill="#c4b5fd">v0.4.2</text>
    <text class="t d" x="606" y="100" font-size="13.5">Good-looking disk space analyzer.</text>
    <text class="t d" x="606" y="120" font-size="13.5">Treemap, Windows · macOS · Linux.</text>
    <g transform="translate(866,52)">
      <rect width="60" height="70" rx="3" fill="#8b5cf6" fill-opacity=".55"/>
      <rect x="63" width="36" height="40" rx="3" fill="#ff8a3d" fill-opacity=".6"/>
      <rect x="63" y="43" width="17" height="27" rx="3" fill="#ff4d6d" fill-opacity=".55"/>
      <rect x="83" y="43" width="16" height="27" rx="3" fill="#22d3ee" fill-opacity=".45"/>
    </g>
  </g>

  <g class="tile">
    <rect x="580" y="175" width="420" height="155" rx="18" fill="url(#card)"/>
    <rect x="580" y="175" width="420" height="155" rx="18" fill="url(#gC)"/>
    <rect x="580.5" y="175.5" width="419" height="154" rx="18" fill="none" stroke="url(#stroke)"/>
    <text class="m k" x="606" y="209" font-size="10.5">AI · BLENDER · MCP</text>
    <text class="t h" x="606" y="247" font-size="24">claude-bridge-blender</text>
    <text class="t d" x="606" y="275" font-size="13.5">Drive a live Blender with Claude: in-app</text>
    <text class="t d" x="606" y="295" font-size="13.5">chat + token-lean MCP ops for Claude Code.</text>
    <g transform="translate(918,200)">
      <path d="M8 0L0 18H16Z" fill="#ff8a3d" fill-opacity=".7">
        <animateTransform attributeName="transform" type="rotate" values="0 8 12;360 8 12" dur="14s" repeatCount="indefinite"/>
      </path>
      <text class="m" x="28" y="15" font-size="11" fill="#fca5a5">★ 4</text>
    </g>
  </g>

  <g class="tile">
    <rect x="0" y="350" width="330" height="210" rx="18" fill="url(#card)"/>
    <rect x="0" y="350" width="330" height="210" rx="18" fill="url(#gD)"/>
    <rect x=".5" y="350.5" width="329" height="209" rx="18" fill="none" stroke="url(#stroke)"/>
    <text class="m k" x="26" y="384" font-size="10.5">TOOLING · FIVEM</text>
    <text class="t h" x="26" y="422" font-size="24">fivem-launcher</text>
    <text class="t d" x="26" y="452" font-size="13.5">Run and manage FXServer</text>
    <text class="t d" x="26" y="472" font-size="13.5">instances. Tauri 2 + Svelte 5,</text>
    <text class="t d" x="26" y="492" font-size="13.5">with a remote web panel.</text>
    <text class="m" x="26" y="532" font-size="11" fill="#67e8f9">v0.4.1 · auto-updates</text>
  </g>

  <g class="tile">
    <rect x="350" y="350" width="330" height="210" rx="18" fill="url(#card)"/>
    <rect x="350" y="350" width="330" height="210" rx="18" fill="url(#gE)"/>
    <rect x="350.5" y="350.5" width="329" height="209" rx="18" fill="none" stroke="url(#stroke)"/>
    <text class="m k" x="376" y="384" font-size="10.5">LIVE · PERSONAL</text>
    <text class="t h" x="376" y="422" font-size="24">thejacks.xyz</text>
    <text class="t d" x="376" y="452" font-size="13.5">Portfolio with a skill map,</text>
    <text class="t d" x="376" y="472" font-size="13.5">3D scenes and a live GitHub</text>
    <text class="t d" x="376" y="492" font-size="13.5">feed. Next.js + Three.js.</text>
    <circle cx="380" cy="528" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text class="m" x="392" y="532" font-size="11" fill="#86efac">online</text>
  </g>

  <g class="tile">
    <rect x="700" y="350" width="300" height="210" rx="18" fill="url(#card)"/>
    <rect x="700.5" y="350.5" width="299" height="209" rx="18" fill="none" stroke="url(#stroke)"/>
    <text class="m k" x="726" y="384" font-size="10.5">CLIENT WORK</text>
    <text class="t h" x="726" y="422" font-size="20">biro-butor</text>
    <text class="t d" x="726" y="444" font-size="12.5">Office furniture showcase · Astro</text>
    <line x1="726" y1="464" x2="974" y2="464" stroke="#fff" stroke-opacity=".07"/>
    <text class="t h" x="726" y="494" font-size="20">duna-palma</text>
    <text class="t d" x="726" y="516" font-size="12.5">Restaurant, menu + ordering · Astro</text>
    <rect x="726" y="534" width="248" height="3" rx="1.5" fill="#fff" fill-opacity=".06"/>
    <rect x="726" y="534" width="248" height="3" rx="1.5" fill="url(#bar)">
      <animate attributeName="width" values="0;248" dur="1.6s" fill="freeze"/>
    </rect>
  </g>
</svg>
