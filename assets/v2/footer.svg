<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Let's build something. thejacks.xyz">
  <defs>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="750" y2="0">
      <stop offset="0" stop-color="#ffd9a0"/><stop offset=".5" stop-color="#ff8a6b"/><stop offset="1" stop-color="#c4b5fd"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-200 0;200 0;-200 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".16"/><stop offset=".6" stop-color="#8b5cf6" stop-opacity=".06"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
      .m{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace}
    </style>
  </defs>
  <ellipse cx="500" cy="118" rx="420" ry="100" fill="url(#glow)"/>
  <rect x="200" y="20" width="600" height="1" fill="url(#rule)"/>
  <text class="m" x="500" y="66" text-anchor="middle" font-size="12" fill="#6b7280" letter-spacing="3">MOST OF MY WORK IS PRIVATE · THE CARDS COUNT IT ALL</text>
  <text class="t" x="500" y="134" text-anchor="middle" font-size="52" font-weight="700" letter-spacing="-2" fill="url(#txt)">let's build something.</text>
  <text class="m" x="500" y="180" text-anchor="middle" font-size="14" fill="#a1a1aa">thejacks.xyz <tspan fill="#52525b">/</tspan> jackfunc@gmail.com</text>
</svg>
