<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 92" width="1000" height="92" role="img" aria-label="04 topology — how the pieces fit together">
  <defs>
    <linearGradient id="s04bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1615"/><stop offset="100%" stop-color="#171212"/>
    </linearGradient>
    <linearGradient id="s04rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb454" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="s04f"><rect width="1000" height="92" rx="12"/></clipPath>
    <clipPath id="s04type"><rect x="0" y="0" height="92" width="0">
      <animate attributeName="width" from="0" to="1000" begin="0.6599999999999999s" dur="0.9s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#s04f)" font-family="'Cascadia Code',Consolas,'SF Mono',monospace">
    <rect width="1000" height="92" fill="url(#s04bg)"/>

    <!-- numeral block -->
    <rect x="0" y="0" width="3" height="92" fill="#ffb454" opacity=".85"/>
    <text x="30" y="59" font-size="34" font-weight="700" fill="#ffb454" fill-opacity=".22">04</text>

    <g clip-path="url(#s04type)">
      <text x="98" y="44" font-size="23" font-weight="600" fill="#f2ece6" letter-spacing="1.5"
            font-family="'Segoe UI Semibold','Helvetica Neue',Arial,sans-serif">topology</text>
      <text x="98" y="70" font-size="13" fill="#a2938a" letter-spacing="1.2">how the pieces fit together</text>
    </g>

    <!-- caret parked at the end of the type reveal -->
    <rect x="98" y="26" width="2" height="22" fill="#ffb454">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x" from="98" to="206" begin="0.6599999999999999s" dur="0.9s" fill="freeze"/>
    </rect>

    <!-- travelling underline -->
    <rect x="98" y="76" width="0" height="1.5" fill="url(#s04rule)">
      <animate attributeName="width" from="0" to="840" begin="1.46s" dur="1.1s" fill="freeze"/>
    </rect>

    <!-- right-edge tick marks, a quiet ruler -->
    <g stroke="#ffb454" stroke-opacity=".35">
      <line x1="976" y1="62" x2="976" y2="70" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0s" repeatCount="indefinite"/></line>
      <line x1="964" y1="62" x2="964" y2="71" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.18s" repeatCount="indefinite"/></line>
      <line x1="952" y1="62" x2="952" y2="72" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.36s" repeatCount="indefinite"/></line>
      <line x1="940" y1="62" x2="940" y2="73" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.54s" repeatCount="indefinite"/></line>
      <line x1="928" y1="62" x2="928" y2="74" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.72s" repeatCount="indefinite"/></line>
      <line x1="916" y1="62" x2="916" y2="75" stroke-width="1"><animate attributeName="stroke-opacity" values=".05;.5;.05" dur="3s" begin="0.8999999999999999s" repeatCount="indefinite"/></line>
    </g>

    <rect width="1000" height="92" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
