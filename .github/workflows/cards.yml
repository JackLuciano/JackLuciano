name: build stat cards

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-cards.mjs"
      - ".github/workflows/cards.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate SVG cards
        env:
          # CARDS_TOKEN must be a classic PAT owned by you with `repo` + `read:user`.
          # The default GITHUB_TOKEN is a bot identity and can only see PUBLIC
          # activity, which would report 0 commits for a private-only account.
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/build-cards.mjs

      - name: Generate 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/heatmap.svg profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: refresh generated cards"
          git push
